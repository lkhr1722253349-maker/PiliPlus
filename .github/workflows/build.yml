name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: false
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: false
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  test -n '${{ secrets.SIGN_KEYSTORE_BASE64 }}'
                  test -n '${{ secrets.KEYSTORE_PASSWORD }}'
                  test -n '${{ secrets.KEY_ALIAS }}'
                  test -n '${{ secrets.KEY_PASSWORD }}'
                  echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                  echo storeFile='key.jks' >> android/key.properties
                  echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                  echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                  echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Create Android delta patches
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT_TAG: ${{ github.event.inputs.tag }}
                  # How many previous builds keep a delta base, so a device that
                  # skipped several versions can still update in one step.
                  DELTA_BASES: "5"
              shell: bash
              run: |
                  set -euo pipefail
                  sudo apt-get update -qq
                  sudo apt-get install -y bsdiff
                  new=$(find . -maxdepth 1 -name "PiliPlus_android_*_arm64-v8a.apk" -print -quit)
                  [[ -n "$new" ]] || { echo 'No new APK to diff against'; exit 0; }
                  new_code=$(basename "$new" | sed -nE 's/.*\+([0-9]+)_arm64-v8a\.apk$/\1/p')
                  echo "New build version code: ${new_code:-unknown}"

                  # Collect candidate base APKs from the most recent builds. A
                  # build can be reachable as a release asset or, once that
                  # release is pruned, only as an Actions artifact; both are
                  # tried so the delta window does not shrink when old releases
                  # are cleaned up.
                  rm -rf bases && mkdir -p bases
                  declare -A seen_codes
                  consider() {
                    local file="$1" code
                    code=$(basename "$file" | sed -nE 's/.*\+([0-9]+)_arm64-v8a\.apk$/\1/p')
                    if [[ -z "$code" ]]; then
                      echo "Skip $(basename "$file"): unparsable version code"
                      return 0
                    fi
                    if [[ "$code" == "$new_code" ]]; then
                      echo "Skip $(basename "$file"): same version code"
                      return 0
                    fi
                    if [[ -n "${seen_codes[$code]:-}" ]]; then
                      echo "Skip $(basename "$file"): code $code already collected"
                      return 0
                    fi
                    seen_codes[$code]=1
                    cp "$file" "bases/${code}_arm64-v8a.apk"
                    echo "Collected base $code from $(basename "$file")"
                  }

                  mapfile -t previous_tags < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                    --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\" and .draft == false) | .tag_name" \
                    | head -n "${DELTA_BASES}")
                  for previous_tag in "${previous_tags[@]}"; do
                    rm -rf previous && mkdir -p previous
                    if gh release download "$previous_tag" --pattern 'PiliPlus_android_*_arm64-v8a.apk' --dir previous 2>/dev/null; then
                      while IFS= read -r -d '' f; do consider "$f"; done < <(find previous -name 'PiliPlus_android_*_arm64-v8a.apk' -print0)
                    else
                      echo "No release asset in ${previous_tag}; will try artifacts"
                    fi
                  done

                  # Artifacts survive release pruning and cover builds that were
                  # never published, so they fill the rest of the delta window.
                  # The API does not guarantee newest-first order, so sort by
                  # creation time explicitly.
                  mapfile -t artifact_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                    --jq '.artifacts[] | select(.expired == false) | select(.name | test("PiliPlus_android_.*_arm64-v8a\\.apk$")) | [.created_at, (.id|tostring)] | join(" ")' \
                    | sort -r | head -n "${DELTA_BASES}" | awk '{print $2}' || true)
                  echo "Artifact candidates: ${artifact_ids[*]:-none}"
                  for artifact_id in "${artifact_ids[@]:-}"; do
                    if (( ${#seen_codes[@]} >= DELTA_BASES )); then break; fi
                    rm -rf artifact && mkdir -p artifact
                    # `gh api -o` writes the zip to a file; piping binary
                    # through stdout is not reliable.
                    if ! gh api -o artifact/a.zip "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" 2>/dev/null; then
                      echo "Skip artifact ${artifact_id}: download failed"
                      continue
                    fi
                    if ! unzip -q -o artifact/a.zip -d artifact >/dev/null 2>&1; then
                      echo "Skip artifact ${artifact_id}: not a readable zip"
                      continue
                    fi
                    while IFS= read -r -d '' f; do consider "$f"; done < <(find artifact -name 'PiliPlus_android_*_arm64-v8a.apk' -print0)
                  done

                  if (( ${#seen_codes[@]} == 0 )); then
                    echo 'No base APK available; this release establishes the delta base.'
                    exit 0
                  fi

                  shopt -s nullglob
                  for base in bases/*_arm64-v8a.apk; do
                    old_code=$(basename "$base" | sed -nE 's/^([0-9]+)_arm64-v8a\.apk$/\1/p')
                    patch="PiliPlus_android_from_${old_code}_arm64-v8a.patch"
                    bsdiff "$base" "$new" "$patch"
                    bspatch "$base" "reconstructed.apk" "$patch"
                    cmp "$new" "reconstructed.apk"
                    rm -f "reconstructed.apk"
                    if (( $(stat -c%s "$patch") * 10 >= $(stat -c%s "$new") * 8 )); then
                      echo "Drop ${patch}: not smaller than the full APK"
                      rm -f "$patch"
                    else
                      echo "Built ${patch} from version code ${old_code}"
                    fi
                  done

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  # Without an explicit target the tag is created on the default
                  # branch, which points at a different commit than the one this
                  # run built. Pin it to the commit that was actually checked out.
                  target_commitish: ${{ github.sha }}
                  name: ${{ github.event.inputs.tag }}
                  body: |
                      PiliPlus 二次开发版本，非原项目官方发布。
                      原项目：https://github.com/bggRGjQaUbCoE/PiliPlus
                      请勿将此版本用于商业用途；项目仍按 GPLv3 授权。
                      听歌歌单支持从网易云歌曲 / 歌单链接导入，并按歌名、歌手和时长匹配 B 站音源。
                      Android：仅提供 arm64-v8a 两个文件——完整包 PiliPlus_android_*.apk 与差分包 PiliPlus_android_from_*.patch。
                      应用内更新优先使用差分包，校验失败自动回退完整包。
                      Windows：提供 PiliPlus_windows_*_x64_setup.exe 安装版与 PiliPlus_windows_*_x64_portable.zip 便携版，随同一次构建产出。
                  files: |
                      PiliPlus_android_*_arm64-v8a.apk
                      PiliPlus_android_from_*_arm64-v8a.patch

            - name: Prune older releases
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT_TAG: ${{ github.event.inputs.tag }}
                  # Keep the recent releases that still provide a delta base for
                  # devices that skipped versions. Must match DELTA_BASES above.
                  KEEP_RELEASES: "6"
              shell: bash
              run: |
                  set -euo pipefail
                  # Fail fast: never delete the base release if this release is missing.
                  gh release view "$CURRENT_TAG" >/dev/null
                  mapfile -t tags < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
                  kept=0
                  for t in "${tags[@]}"; do
                    (( kept++ < KEEP_RELEASES )) && { echo "Keeping $t"; continue; }
                    echo "Removing older release $t (outside the delta window)"
                    gh release delete "$t" --yes --cleanup-tag
                  done
                  echo "Kept the newest ${KEEP_RELEASES} releases including ${CURRENT_TAG}"

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk
                  # Keep each APK long enough to serve as a delta base after its
                  # release has been pruned from the release list.
                  retention-days: 90

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
