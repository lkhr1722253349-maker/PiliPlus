name: Build

on:
    pull_request:
        paths:
            - 'patches/**'
            - 'scripts/**'
            - 'upstream.lock'
            - '.github/workflows/**'
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: false
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: false
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: false
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Assemble upstream and customization
              shell: pwsh
              run: scripts/assemble.ps1

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Install Linux test dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev

            - name: Run customization tests
              run: flutter test --no-pub test/pages/listening test/utils/accounts test/utils/extended_speeds_test.dart

            - name: Write key
              if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  test -n "$SIGN_KEYSTORE_BASE64"
                  test -n "$KEYSTORE_PASSWORD"
                  test -n "$KEY_ALIAS"
                  test -n "$KEY_PASSWORD"
                  printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  echo storeFile='key.jks' >> android/key.properties
                  echo storePassword="$KEYSTORE_PASSWORD" >> android/key.properties
                  echo keyAlias="$KEY_ALIAS" >> android/key.properties
                  echo keyPassword="$KEY_PASSWORD" >> android/key.properties

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
              run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
              run: flutter build apk --debug --target-platform android-arm64 --split-per-abi --no-pub

            - name: Verify APK native libraries
              shell: pwsh
              run: |
                  $apk = Get-ChildItem build/app/outputs/flutter-apk -Filter 'app-arm64-v8a-*.apk' | Select-Object -First 1
                  if (!$apk) { throw 'Missing arm64 APK' }
                  lib/scripts/verify_apk.ps1 $apk.FullName

            - name: Rename
              env:
                  APK_VERSION: ${{ env.version }}
              shell: pwsh
              run: |
                  $apk = @(Get-ChildItem build/app/outputs/flutter-apk -Filter 'app-arm64-v8a-*.apk')
                  if ($apk.Count -ne 1) { throw 'Expected one arm64 APK' }
                  Move-Item -LiteralPath $apk[0].FullName -Destination "PiliPlus_android_${env:APK_VERSION}_arm64-v8a.apk"

            - name: Create Android delta patches
              id: delta
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT_TAG: ${{ github.event.inputs.tag }}
              shell: bash
              run: |
                  set -euo pipefail
                  previous_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq '[.[] | select(.draft == false and .prerelease == false and any(.assets[]; .name | test("^PiliPlus_android_.*_arm64-v8a[.]apk$")))] | .[0].tag_name // empty')
                  if [[ -z "$previous_tag" || "$previous_tag" == "$CURRENT_TAG" ]]; then
                    echo 'No previous fork release; this release establishes the delta base.'
                    exit 0
                  fi
                  mkdir -p previous
                  gh release download "$previous_tag" --pattern 'PiliPlus_android_*_*.apk' --dir previous
                  sudo apt-get update -qq
                  sudo apt-get install -y bsdiff
                  for abi in arm64-v8a; do
                    old=$(find previous -maxdepth 1 -name "PiliPlus_android_*_${abi}.apk" -print -quit)
                    new=$(find . -maxdepth 1 -name "PiliPlus_android_*_${abi}.apk" -print -quit)
                    [[ -n "$old" && -n "$new" ]] || continue
                    apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
                    old_signers=$("$apksigner" verify --print-certs "$old" | awk -F ': ' '/certificate SHA-256 digest:/ { print $2 }' | sort)
                    new_signers=$("$apksigner" verify --print-certs "$new" | awk -F ': ' '/certificate SHA-256 digest:/ { print $2 }' | sort)
                    if [[ -z "$old_signers" || "$old_signers" != "$new_signers" ]]; then
                      echo 'The new APK signer differs from the published APK.' >&2
                      exit 1
                    fi
                    if [[ "$(basename "$old")" =~ \+([0-9]+)_${abi}\.apk$ ]]; then
                      old_code="${BASH_REMATCH[1]}"
                    else
                      continue
                    fi
                    patch="PiliPlus_android_from_${old_code}_${abi}.patch"
                    bsdiff "$old" "$new" "$patch"
                    bspatch "$old" "reconstructed_${abi}.apk" "$patch"
                    cmp "$new" "reconstructed_${abi}.apk"
                    rm "reconstructed_${abi}.apk"
                    if (( $(stat -c%s "$patch") * 10 >= $(stat -c%s "$new") * 8 )); then
                      rm "$patch"
                    fi
                    if [[ -f "$patch" ]]; then echo "patch=$patch" >> "$GITHUB_OUTPUT"; fi
                  done

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ inputs.tag }}
                  target_commitish: ${{ github.sha }}
                  fail_on_unmatched_files: true
                  name: ${{ github.event.inputs.tag }}
                  body: |
                      PiliPlus 二次开发版本，非原项目官方发布。
                      原项目：https://github.com/bggRGjQaUbCoE/PiliPlus
                      请勿将此版本用于商业用途；项目仍按 GPLv3 授权。
                      听歌歌单支持从网易云歌曲 / 歌单链接导入，并按歌名、歌手和时长匹配 B 站音源。
                      Android 提供 arm64-v8a 完整包，符合条件时附上差分包。
                      应用内更新优先使用差分包，校验失败自动回退完整包。
                  files: |
                      PiliPlus_android_*_arm64-v8a.apk
                      ${{ steps.delta.outputs.patch }}

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

    ios:
        if: ${{ github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
