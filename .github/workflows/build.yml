name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: false
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: false
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: false
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  test -n '${{ secrets.SIGN_KEYSTORE_BASE64 }}'
                  test -n '${{ secrets.KEYSTORE_PASSWORD }}'
                  test -n '${{ secrets.KEY_ALIAS }}'
                  test -n '${{ secrets.KEY_PASSWORD }}'
                  echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                  echo storeFile='key.jks' >> android/key.properties
                  echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                  echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                  echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Create Android delta patches
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT_TAG: ${{ github.event.inputs.tag }}
              shell: bash
              run: |
                  set -euo pipefail
                  previous_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq ".[] | select(.tag_name != \"${CURRENT_TAG}\" and .draft == false) | .tag_name" | head -n 1)
                  if [[ -z "$previous_tag" ]]; then
                    echo 'No previous fork release; this release establishes the delta base.'
                    exit 0
                  fi
                  mkdir -p previous
                  gh release download "$previous_tag" --pattern 'PiliPlus_android_*_*.apk' --dir previous
                  sudo apt-get update -qq
                  sudo apt-get install -y bsdiff
                  for abi in arm64-v8a armeabi-v7a x86_64; do
                    old=$(find previous -maxdepth 1 -name "PiliPlus_android_*_${abi}.apk" -print -quit)
                    new=$(find . -maxdepth 1 -name "PiliPlus_android_*_${abi}.apk" -print -quit)
                    [[ -n "$old" && -n "$new" ]] || continue
                    if [[ "$(basename "$old")" =~ \+([0-9]+)_${abi}\.apk$ ]]; then
                      old_code="${BASH_REMATCH[1]}"
                    else
                      continue
                    fi
                    patch="PiliPlus_android_from_${old_code}_${abi}.patch"
                    bsdiff "$old" "$new" "$patch"
                    bspatch "$old" "reconstructed_${abi}.apk" "$patch"
                    cmp "$new" "reconstructed_${abi}.apk"
                    rm "reconstructed_${abi}.apk"
                    if (( $(stat -c%s "$patch") * 10 >= $(stat -c%s "$new") * 8 )); then
                      rm "$patch"
                    fi
                  done

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  body: |
                      PiliPlus 二次开发版本，非原项目官方发布。
                      原项目：https://github.com/bggRGjQaUbCoE/PiliPlus
                      请勿将此版本用于商业用途；项目仍按 GPLv3 授权。
                      听歌歌单支持从网易云歌曲 / 歌单链接导入，并按歌名、歌手和时长匹配 B 站音源。
                      Android：发布完整 APK；存在适配当前版本的差分包时优先使用，校验失败自动回退完整包。
                  files: |
                      PiliPlus_android_*.apk
                      PiliPlus_android_*.patch

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPlus_android_*_x86_64.apk

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
